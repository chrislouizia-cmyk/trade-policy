name: Community Strategies CI

on:
  pull_request:
    paths:
      - 'app/community/**'
      - 'app/api/community/**'
      - 'components/InstallCommunityStrategy.tsx'
      - 'components/AppFooter.tsx'
      - '.github/workflows/community-strategies-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-build-only'
